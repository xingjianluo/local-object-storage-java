# ===== 本地对象存储配置 =====
# 存储根目录（blobs / objects / uploads 均位于其下）
storage.root-dir=${STORAGE_ROOT:data/storage}
# 分片上传会话有效期（毫秒），默认 24h
storage.session-ttl-millis=${STORAGE_SESSION_TTL:86400000}
# 后台回收周期间隔（毫秒），默认 5 分钟
storage.reap-interval-millis=${STORAGE_REAP_INTERVAL:300000}
# 流式合并/校验的拷贝缓冲区大小（字节），内存占用上界与对象总大小无关
storage.copy-buffer-size=${STORAGE_COPY_BUFFER:65536}
# 不可达 blob 进入回收前的宽限期（毫秒），覆盖进行中的提交窗口
storage.blob-gc-grace-millis=${STORAGE_BLOB_GC_GRACE:60000}
